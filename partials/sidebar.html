  </div>
  <div class="brand text-start" id="sidebarUsername"></div>
</div>

<script>
// Sidebar username display logic
function updateSidebarUsername() {
  var el = document.getElementById('sidebarUsername');
  var avatar = document.getElementById('sidebarUserAvatar');
  if (!el || !avatar) return;
  var name = localStorage.getItem('user_nickname') || sessionStorage.getItem('user_nickname');
  if (name && name.trim().length > 0) {
    el.textContent = name;
    avatar.style.display = '';
  } else {
    el.textContent = '';
    avatar.style.display = 'none';
  }
}
// Run on DOMContentLoaded and expose for reloads
document.addEventListener('DOMContentLoaded', updateSidebarUsername);
window.loadSidebar = updateSidebarUsername;
</script>
