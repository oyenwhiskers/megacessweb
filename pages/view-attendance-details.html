<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Attendance Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/megacessweb/assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="view-attendance-details">
  <div class="app d-flex">
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <main class="content flex-grow-1">
      <div class="topbar py-3 px-4 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0">Attendance Details</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
      </div>
      <div class="container-fluid p-4">
        <button class="btn btn-success mb-3" onclick="window.history.back()">
          <i class="bi bi-arrow-left"></i> Back to Attendance
        </button>

        <!-- User Info Card -->
        <div class="card" style="background: #d4f8d4; border-radius: 16px; border: none;">
          <div class="card-body">
            <div class="d-flex align-items-center mb-3" style="background: #fff; border-radius: 12px; padding: 16px;">
              <img id="workerAvatar" src="https://ui-avatars.com/api/?name=User&background=cccccc&color=fff&size=96" alt="Avatar" class="rounded-circle me-3" style="width: 64px; height: 64px; object-fit: cover;">
              <div>
                <div id="workerName" class="fw-bold" style="font-size: 1.25rem;">Loading...</div>
                <div id="workerRole" class="text-muted">Loading...</div>
              </div>
            </div>

            <!-- Date Filter -->
            <div class="mb-3">
              <div class="d-flex gap-2 align-items-center">
                <select id="analyticsYear" class="form-select w-auto" style="min-width: 100px;">
                  <option>2023</option>
                  <option>2024</option>
                  <option selected>2025</option>
                </select>
                <select id="analyticsMonth" class="form-select w-auto" style="min-width: 160px;">
                  <option>January</option>
                  <option>February</option>
                  <option>March</option>
                  <option>April</option>
                  <option>May</option>
                  <option>June</option>
                  <option>July</option>
                  <option>August</option>
                  <option>September</option>
                  <option>October</option>
                  <option>November</option>
                  <option selected>December</option>
                </select>
              </div>
            </div>

            <!-- Analytics Cards -->
            <div class="row g-3">
              <div class="col-md-4">
                <div class="card shadow-sm" style="border-radius: 12px;">
                  <div class="card-body text-center p-3">
                    <div class="text-muted mb-1" style="font-size: 1rem;">Attendance Rate</div>
                    <div id="attendanceRate" class="fw-bold" style="font-size: 2rem; color: #176c2f;">...</div>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card shadow-sm" style="border-radius: 12px;">
                  <div class="card-body text-center p-3">
                    <div class="text-muted mb-1" style="font-size: 1rem;">Punctuality Rate</div>
                    <div id="punctualityRate" class="fw-bold" style="font-size: 2rem; color: #176c2f;">...</div>
                  </div>
                </div>
              </div>
              <div class="col-md-4">
                <div class="card shadow-sm" style="border-radius: 12px;">
                  <div class="card-body text-center p-3">
                    <div class="text-muted mb-1" style="font-size: 1rem;">Number of days absence</div>
                    <div id="numberAbsent" class="fw-bold" style="font-size: 2rem; color: #176c2f;">...</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Attendance Records Section -->
            <div class="mt-4">
              <h6 class="fw-bold mb-2">Attendance Records</h6>
              <div class="d-flex gap-2 align-items-center mb-2">
                <select id="recordsYear" class="form-select w-auto" style="min-width: 100px;">
                  <option>2023</option>
                  <option>2024</option>
                  <option selected>2025</option>
                </select>
                <select id="recordsMonth" class="form-select w-auto" style="min-width: 160px;">
                  <option>January</option>
                  <option>February</option>
                  <option>March</option>
                  <option>April</option>
                  <option>May</option>
                  <option>June</option>
                  <option>July</option>
                  <option>August</option>
                  <option>September</option>
                  <option>October</option>
                  <option>November</option>
                  <option selected>December</option>
                </select>
                <select id="recordsStatus" class="form-select w-auto" style="min-width: 140px;">
                  <option value="all">All Status</option>
                  <option value="present">Present</option>
                  <option value="absent">Absent</option>
                  <option value="late">Late</option>
                  <option value="annual_leave">Annual Leave</option>
                  <option value="sick_leave">Sick Leave</option>
                  <option value="unpaid_leave">Unpaid Leave</option>
                </select>
              </div>
              <div id="attendanceRecords" class="table-responsive"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- View Record Details Modal -->
  <div class="modal fade" id="recordDetailsModal" tabindex="-1" aria-labelledby="recordDetailsModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content" style="background:#eaeaea;">
        <div class="modal-header" style="border-bottom:1px solid #444;">
          <h5 class="modal-title fw-bold" id="recordDetailsModalLabel">View Attendance Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="recordDetailsContent">
          <!-- Content will be loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/megacessweb/assets/js/main.js"></script>
  <script src="/megacessweb/assets/js/logout.js"></script>
  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const workerId = urlParams.get('id');
    const workerType = urlParams.get('type') || 'worker';

    // Helper functions
    function getAuthToken() {
      return localStorage.getItem('authToken') || localStorage.getItem('auth_token') || 
             sessionStorage.getItem('authToken') || sessionStorage.getItem('auth_token') || '';
    }

    function getStatusBadge(status) {
      const badges = {
        'Present': '<span class="badge" style="background:#198754;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-check2 me-1"></i>Present</span>',
        'Absent': '<span class="badge" style="background:#dc3545;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-x-lg me-1"></i>Absent</span>',
        'Late': '<span class="badge" style="background:#a86b32;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-alarm me-1"></i>Late</span>',
        'Annual Leave': '<span class="badge" style="background:#0d6efd;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-calendar2-week me-1"></i>Annual Leave</span>',
        'annual_leave': '<span class="badge" style="background:#0d6efd;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-calendar2-week me-1"></i>Annual Leave</span>',
        'Sick Leave': '<span class="badge" style="background:#0dcaf0;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-thermometer-half me-1"></i>Sick Leave</span>',
        'sick_leave': '<span class="badge" style="background:#0dcaf0;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-thermometer-half me-1"></i>Sick Leave</span>',
        'Unpaid Leave': '<span class="badge" style="background:#e6bfc0;color:#b94a48;font-weight:500;font-size:1rem;"><i class="bi bi-calendar-x me-1"></i>Unpaid Leave</span>',
        'unpaid_leave': '<span class="badge" style="background:#e6bfc0;color:#b94a48;font-weight:500;font-size:1rem;"><i class="bi bi-calendar-x me-1"></i>Unpaid Leave</span>',
        'Check_in': '<span class="badge" style="background:#6c757d;color:#fff;font-weight:500;font-size:1rem;"><i class="bi bi-box-arrow-in-right me-1"></i>Check In</span>'
      };
      return badges[status] || `<span class="badge bg-secondary" style="font-weight:500;font-size:1rem;">${status}</span>`;
    }

    function getStatusBorderColor(status) {
      const colors = {
        'Present': '#198754',
        'Absent': '#dc3545',
        'Late': '#a86b32',
        'Annual Leave': '#0d6efd',
        'annual_leave': '#0d6efd',
        'Sick Leave': '#0dcaf0',
        'sick_leave': '#0dcaf0',
        'Unpaid Leave': '#b94a48',
        'unpaid_leave': '#b94a48',
        'Check_in': '#6c757d'
      };
      return colors[status] || '#6c757d';
    }

    function getStatusButtonStyleAndIcon(status) {
      const styles = {
        'Present': { color: '#118c4f', icon: '<i class="bi bi-check2"></i>' },
        'Absent': { color: '#c90000', icon: '<i class="bi bi-x-lg"></i>' },
        'Late': { color: '#a86b32', icon: '<i class="bi bi-alarm"></i>' },
        'Annual Leave': { color: '#155fa0', icon: '<i class="bi bi-calendar2-week"></i>' },
        'annual_leave': { color: '#155fa0', icon: '<i class="bi bi-calendar2-week"></i>' },
        'Sick Leave': { color: '#00a6d6', icon: '<i class="bi bi-thermometer-half"></i>' },
        'sick_leave': { color: '#00a6d6', icon: '<i class="bi bi-thermometer-half"></i>' },
        'Unpaid Leave': { color: '#b97b7b', icon: '<i class="bi bi-calendar-x"></i>' },
        'unpaid_leave': { color: '#b97b7b', icon: '<i class="bi bi-calendar-x"></i>' }
      };
      return styles[status] || { color: '#6c757d', icon: '' };
    }

    // Fetch worker info
    async function fetchWorkerInfo() {
      const token = getAuthToken();
      if (!token || !workerId) return;

      try {
        const response = await fetch(`https://mwms.megacess.com/api/v1/staff/${workerId}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          }
        });

        if (!response.ok) return;
        const data = await response.json();
        const workerInfo = data.data;

        if (workerInfo) {
          document.getElementById('workerName').textContent = workerInfo.staff_fullname || 'Unknown';
          document.getElementById('workerRole').textContent = workerInfo.staff_role || 'Worker';

          const avatar = document.getElementById('workerAvatar');
          if (workerInfo.staff_img && typeof workerInfo.staff_img === 'string' && workerInfo.staff_img.trim() !== '') {
            let imgUrl = workerInfo.staff_img.replace(/:\d+$/, '').trim();
            if (!imgUrl.startsWith('http') && !imgUrl.startsWith('/')) {
              imgUrl = `https://mwms.megacess.com/storage/user-images/${imgUrl}`;
            } else if (imgUrl.startsWith('/')) {
              imgUrl = `https://mwms.megacess.com${imgUrl}`;
            }
            avatar.src = imgUrl;
            avatar.onerror = function() {
              this.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(workerInfo.staff_fullname || 'User')}&background=cccccc&color=fff&size=96`;
              this.onerror = null;
            };
          } else {
            avatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(workerInfo.staff_fullname || 'User')}&background=cccccc&color=fff&size=96`;
          }
        }
      } catch (error) {
        console.error('Error fetching worker info:', error);
      }
    }

    // Fetch attendance analytics
    async function fetchAttendanceAnalytics(month) {
      const token = getAuthToken();
      if (!token || !workerId) return null;

      try {
        const response = await fetch(`https://mwms.megacess.com/api/v1/staff-attendance/${workerId}/analytics?month=${month}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          }
        });

        if (!response.ok) return null;
        const data = await response.json();
        return data && data.data ? data.data : null;
      } catch (error) {
        console.error('Error fetching analytics:', error);
        return null;
      }
    }

    // Fetch attendance records
    async function fetchAttendanceRecords(month) {
      const token = getAuthToken();
      if (!token || !workerId) return [];

      try {
        const url = `https://mwms.megacess.com/api/v1/staff-attendance/${workerId}/records${month ? '?month=' + month : ''}`;
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          }
        });

        if (!response.ok) return [];
        const data = await response.json();
        return data && data.data && data.data.data ? data.data.data : [];
      } catch (error) {
        console.error('Error fetching records:', error);
        return [];
      }
    }

    // Update analytics
    async function updateAnalytics() {
      const year = document.getElementById('analyticsYear').value;
      const monthSelect = document.getElementById('analyticsMonth');
      const monthMap = {
        'January': 1, 'February': 2, 'March': 3, 'April': 4, 'May': 5, 'June': 6,
        'July': 7, 'August': 8, 'September': 9, 'October': 10, 'November': 11, 'December': 12
      };
      const month = String(monthMap[monthSelect.value] || new Date().getMonth() + 1).padStart(2, '0');
      const monthStr = `${year}-${month}`;

      const analytics = await fetchAttendanceAnalytics(monthStr);
      if (analytics) {
        document.getElementById('attendanceRate').textContent = analytics.attendance_rate + '%';
        document.getElementById('punctualityRate').textContent = analytics.punctuality_rate + '%';
        document.getElementById('numberAbsent').textContent = analytics.number_absent;
      } else {
        document.getElementById('attendanceRate').textContent = 'N/A';
        document.getElementById('punctualityRate').textContent = 'N/A';
        document.getElementById('numberAbsent').textContent = 'N/A';
      }
    }

    // Render attendance records
    function renderAttendanceRecords(records) {
      const container = document.getElementById('attendanceRecords');
      if (!records || records.length === 0) {
        container.innerHTML = '<div class="text-muted">No attendance records found for this month.</div>';
        return;
      }

      const allowedStatuses = ['Present', 'Absent', 'Late', 'Annual Leave', 'annual_leave', 'Unpaid Leave', 'unpaid_leave', 'Sick Leave', 'sick_leave', 'Sick Leave (MC)', 'MC'];
      const filteredRecords = records.filter(r => allowedStatuses.includes(r.status));

      if (filteredRecords.length === 0) {
        container.innerHTML = '<div class="text-muted">No attendance records found for this month.</div>';
        return;
      }

      let html = '<div class="attendance-records-list" style="max-height: 370px; overflow-y: auto;">';
      filteredRecords.forEach(r => {
        const borderColor = getStatusBorderColor(r.status);
        const { color, icon } = getStatusButtonStyleAndIcon(r.status);
        html += `<div class="attendance-record-card d-flex align-items-center justify-content-between mb-2" style="border:1px solid #b6b6b6;border-left:16px solid ${borderColor};background:#fff;padding:0.75rem 1rem;min-height:56px;border-radius:6px;">
          <div><strong>${r.date}</strong></div>
          <button class="btn" style="background:${color};color:#fff;font-weight:500;min-width:140px;box-shadow:0 2px 6px rgba(0,0,0,0.08);border-radius:10px;" onclick="showRecordDetails('${encodeURIComponent(JSON.stringify(r))}')">${icon} ${r.status}</button>
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }

    // Update records
    async function updateRecords() {
      const year = document.getElementById('recordsYear').value;
      const monthSelect = document.getElementById('recordsMonth');
      const statusSelect = document.getElementById('recordsStatus');
      const monthMap = {
        'January': 1, 'February': 2, 'March': 3, 'April': 4, 'May': 5, 'June': 6,
        'July': 7, 'August': 8, 'September': 9, 'October': 10, 'November': 11, 'December': 12
      };
      const month = String(monthMap[monthSelect.value] || new Date().getMonth() + 1).padStart(2, '0');
      const monthStr = `${year}-${month}`;

      const records = await fetchAttendanceRecords(monthStr);
      let filteredRecords = records;

      if (statusSelect.value !== 'all') {
        filteredRecords = records.filter(r => {
          const statusVal = statusSelect.value;
          if (statusVal === 'present') return r.status === 'Present';
          if (statusVal === 'absent') return r.status === 'Absent';
          if (statusVal === 'late') return r.status === 'Late';
          if (statusVal === 'annual_leave') return r.status === 'Annual Leave' || r.status === 'annual_leave';
          if (statusVal === 'sick_leave') return r.status === 'Sick Leave' || r.status === 'sick_leave';
          if (statusVal === 'unpaid_leave') return r.status === 'Unpaid Leave' || r.status === 'unpaid_leave';
          return true;
        });
      }

      renderAttendanceRecords(filteredRecords);
    }

    // Show record details in modal
    window.showRecordDetails = function(recordJson) {
      const record = JSON.parse(decodeURIComponent(recordJson));
      const statusInfo = getStatusButtonStyleAndIcon(record.status);
      const statusBtn = `<span style="display:inline-block;background:${statusInfo.color};color:#fff;font-weight:500;min-width:120px;padding:8px 20px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.08);font-size:1.1rem;vertical-align:middle;">${statusInfo.icon} ${record.status}</span>`;
      const checkedBy = record.checkedin_by || record.checkedout_by || '';
      const checkInTime = record.check_in ? (new Date(record.check_in).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true })).replace(/^0/, '') : '';

      document.getElementById('recordDetailsContent').innerHTML = `
        <div class='row mb-2'>
          <div class='col-12 col-md-6 mb-3'>
            <div class='text-muted mb-1'>Type of leave:</div>
            ${statusBtn}
          </div>
          <div class='col-12 col-md-6 mb-3'>
            <div class='text-muted mb-1'>Checked by:</div>
            <span class='fw-semibold'>${checkedBy}</span>
          </div>
        </div>
        <div class='row'>
          <div class='col-12 col-md-6 mb-3'>
            <div class='text-muted mb-1'>Date:</div>
            <span>${record.date || ''}</span>
          </div>
          <div class='col-12 col-md-6 mb-3'>
            <div class='text-muted mb-1'>Check in time:</div>
            <span class='fw-semibold'>${checkInTime}</span>
          </div>
        </div>
      `;

      const modal = new bootstrap.Modal(document.getElementById('recordDetailsModal'));
      modal.show();
    };

    // Initialize
    if (workerId) {
      fetchWorkerInfo();
      updateAnalytics();
      updateRecords();

      // Event listeners
      document.getElementById('analyticsYear').addEventListener('change', updateAnalytics);
      document.getElementById('analyticsMonth').addEventListener('change', updateAnalytics);
      document.getElementById('recordsYear').addEventListener('change', updateRecords);
      document.getElementById('recordsMonth').addEventListener('change', updateRecords);
      document.getElementById('recordsStatus').addEventListener('change', updateRecords);
    } else {
      document.getElementById('workerName').textContent = 'No worker selected';
      document.getElementById('workerRole').textContent = '';
    }
  </script>
</body>
</html>
