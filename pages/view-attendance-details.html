<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Attendance Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/manageattendance.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="view-attendance-details">
  <div class="app d-flex">
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <main class="content flex-grow-1">
      <div class="topbar py-3 px-3 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0">View Attendance Details</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
      </div>
      
      <div class="container-fluid p-4">
        <!-- Back Button -->
        <div class="mb-3">
          <a href="/pages/manage-attendance.html" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-2"></i>Back to Attendance
          </a>
        </div>

        <!-- User Info Card -->
        <div class="card mb-4" style="border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); background-color: #d4f8d4;">
          <div class="card-body">
            <div class="d-flex align-items-center">
              <img id="userAvatar" src="" alt="User Avatar" class="rounded-circle me-3" 
                   style="width: 80px; height: 80px; object-fit: cover; background-color: #333; border: 3px solid #b2f5b2;">
              <div>
                <h4 class="mb-1 fw-bold" id="userName">Loading...</h4>
                <p class="mb-0 text-muted" id="userRole">Loading...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Analytics Filter Section -->
        <div class="card mb-4" style="border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
          <div class="card-body">
            <h6 class="mb-3 fw-bold">Filter Analytics</h6>
            <div class="row g-3">
              <div class="col-md-6 col-lg-3">
                <label class="form-label">Year</label>
                <select class="form-select" id="analyticsYear">
                  <!-- Will be populated by JS -->
                </select>
              </div>
              <div class="col-md-6 col-lg-3">
                <label class="form-label">Month</label>
                <select class="form-select" id="analyticsMonth">
                  <option value="01">January</option>
                  <option value="02">February</option>
                  <option value="03">March</option>
                  <option value="04">April</option>
                  <option value="05">May</option>
                  <option value="06">June</option>
                  <option value="07">July</option>
                  <option value="08">August</option>
                  <option value="09">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Analytics Summary Cards -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card shadow-sm" style="border-radius: 12px;">
              <div class="card-body text-center p-4">
                <div class="text-muted fw-semibold mb-2" style="font-size: 1.1rem;">Attendance Rate</div>
                <div id="attendanceRateValue" class="fw-bold" style="font-size: 2.5rem; color: #176c2f;">...</div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm" style="border-radius: 12px;">
              <div class="card-body text-center p-4">
                <div class="text-muted fw-semibold mb-2" style="font-size: 1.1rem;">Punctuality Rate</div>
                <div id="punctualityRateValue" class="fw-bold" style="font-size: 2.5rem; color: #176c2f;">...</div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm" style="border-radius: 12px;">
              <div class="card-body text-center p-4">
                <div class="text-muted fw-semibold mb-2" style="font-size: 1.1rem;">Days Absent</div>
                <div id="numberAbsentValue" class="fw-bold" style="font-size: 2.5rem; color: #176c2f;">...</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Attendance Records Section -->
        <div class="card" style="border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
          <div class="card-body">
            <h5 class="mb-3 fw-bold">Attendance Records</h5>
            <hr>
            <!-- Records Filter -->
            <div class="row g-3 mb-3">
              <div class="col-md-4 col-lg-3">
                <label class="form-label">Year</label>
                <select class="form-select" id="recordsYear">
                  <!-- Will be populated by JS -->
                </select>
              </div>
              <div class="col-md-4 col-lg-3">
                <label class="form-label">Month</label>
                <select class="form-select" id="recordsMonth">
                  <option value="01">January</option>
                  <option value="02">February</option>
                  <option value="03">March</option>
                  <option value="04">April</option>
                  <option value="05">May</option>
                  <option value="06">June</option>
                  <option value="07">July</option>
                  <option value="08">August</option>
                  <option value="09">September</option>
                  <option value="10">October</option>
                  <option value="11">November</option>
                  <option value="12">December</option>
                </select>
              </div>
              <div class="col-md-4 col-lg-3">
                <label class="form-label">Status</label>
                <select class="form-select" id="recordsStatus">
                  <option value="all">All Status</option>
                  <option value="Present">Present</option>
                  <option value="Absent">Absent</option>
                  <option value="Late">Late</option>
                  <option value="Check_in">Check In</option>
                  <option value="Annual_Leave">Annual Leave</option>
                  <option value="Sick_Leave">Sick Leave</option>
                  <option value="Unpaid_Leave">Unpaid Leave</option>
                </select>
              </div>
            </div>
            <!-- Records List -->
            <div id="attendanceRecordsTable">
              <!-- Loading spinner -->
              <div class="text-center py-5">
                <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                  <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Loading attendance records...</p>
              </div>
            </div>
            <!-- Pagination will be inserted here by JS -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- View Record Details Modal -->
  <div class="modal fade" id="attendanceRecordDetailModal" tabindex="-1" aria-labelledby="attendanceRecordDetailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 12px; background: #f4f4f4;">
        <div class="modal-header" style="background: #ededed; border-bottom: none;">
          <h5 class="modal-title fw-semibold" id="attendanceRecordDetailModalLabel">View Attendance Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="padding: 28px 24px 24px 24px;">
          <div class="container-fluid">
            <div class="row mb-3">
              <div class="col-6"><span style="font-weight: 500;">Type of status:</span></div>
              <div class="col-6"><span style="font-weight: 500;">Checked by:</span></div>
            </div>
            <div class="row align-items-center mb-3">
              <div class="col-6" id="detailStatusBadge">-</div>
              <div class="col-6" id="detailCheckedBy">-</div>
            </div>
            <div class="row mb-2">
              <div class="col-6"><span style="font-weight: 500;">Date:</span></div>
              <div class="col-6"><span style="font-weight: 500;">Check in time:</span></div>
            </div>
            <div class="row">
              <div class="col-6" id="detailDate">-</div>
              <div class="col-6" id="detailCheckIn">-</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/logout.js"></script>
  <script src="/assets/js/view_attendance_details.js"></script>
</body>
</html>
