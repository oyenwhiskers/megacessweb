<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Advance Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/manageadvance.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="view-advance-details">
  <div class="app d-flex">
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <main class="content flex-grow-1">
      <div class="topbar py-3 px-4 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0">Advance Details</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
      </div>
      <div class="details-container-fluid p-4">
        <button class="btn btn-success mb-3" id="backBtn" onclick="window.history.back()">
            <i class="bi bi-arrow-left"></i> Back to Advance Menu
          </button>
        <div id="loadingSpinner" class="text-center py-5">
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
        <div id="errorMessage" class="alert alert-danger d-none"></div>
        <div id="contentArea" class="d-none">
          <!-- Person Summary Card -->
          <div class="details-card mb-4">
            <div class="details-card-body p-4">
              <div class="d-flex align-items-center mb-4">
                <div>
                  <h3 class="fw-bold mb-1" id="personName">-</h3>
                  <div class="text-muted" id="personInfo">-</div>
                </div>
              </div>
              <hr>
              <div class="row g-3">
                <div class="col-md-3">
                  <div class="text-muted small">Total Outstanding Balance</div>
                  <div class="fs-4 fw-bold text-danger" id="totalOutstanding">RM 0.00</div>
                </div>
                <div class="col-md-3">
                  <div class="text-muted small">Total Advance Amount</div>
                  <div class="fs-4 fw-bold" id="totalLoan">RM 0.00</div>
                </div>
                <div class="col-md-3">
                  <div class="text-muted small">Total Paid Amount</div>
                  <div class="fs-4 fw-bold text-success" id="totalPaid">RM 0.00</div>
                </div>
                <div class="col-md-3">
                  <div class="text-muted small">Number of Advances</div>
                  <div class="fs-4 fw-bold" id="loanCount">0</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Advance Records List -->
          <div class="details-card">
            <div class="details-card-header d-flex justify-content-between align-items-center p-3">
              <h5 class="fw-bold mb-0">Advance Records</h5>
              <div class="text-white small" id="paginationInfo"></div>
            </div>
            <div class="details-card-section">
              <div id="advanceRecordsList">
                <!-- Records will be rendered here -->
              </div>
              <!-- Pagination Controls -->
              <nav aria-label="Advance records pagination" id="paginationNav" class="d-none">
                <ul class="pagination justify-content-center mb-0 mt-4" id="paginationList">
                  <!-- Pagination items will be rendered here -->
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Advance Modal -->
  <div class="modal fade" id="editAdvanceModal" tabindex="-1" aria-labelledby="editAdvanceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header pb-3">
          <h5 class="modal-title fw-bold" id="editAdvanceModalLabel">Edit Advance Record</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editAdvanceForm">
            <input type="hidden" id="editLoanId">
            <div class="mb-3">
              <label for="editAdvanceDate" class="form-label fw-bold">Date:</label>
              <input type="date" class="form-control" id="editAdvanceDate" required>
            </div>
            <div class="mb-3">
              <label for="editAdvanceAmount" class="form-label fw-bold">Amount:</label>
              <div class="input-group">
                <span class="input-group-text">RM</span>
                <input type="number" step="0.01" class="form-control" id="editAdvanceAmount" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="editAdvancePaidAmount" class="form-label fw-bold">Paid Amount:</label>
              <div class="input-group">
                <span class="input-group-text">RM</span>
                <input type="number" step="0.01" class="form-control" id="editAdvancePaidAmount" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="editAdvanceStatus" class="form-label fw-bold">Status:</label>
              <select class="form-select" id="editAdvanceStatus" required>
                <option value="not_paid">Not Paid</option>
                <option value="partially_paid">Partially Paid</option>
                <option value="paid">Paid</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editAdvanceRemarks" class="form-label fw-bold">Remarks:</label>
              <textarea class="form-control" id="editAdvanceRemarks" rows="3" placeholder="Enter remarks.."></textarea>
            </div>
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-success fw-bold px-3 py-2">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/logout.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/view_advance_details.js"></script>
</body>
</html>
