<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Tasks Trash Bin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .form-select, .form-select option {
      color: #212529 !important;
      background-color: #fff !important;
    }
    .task-card {
      transition: all 0.25s ease-in-out;
      border: 1px solid #f8d7da !important;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }
    .task-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(132, 32, 41, 0.08);
      border-color: #f5c2c7 !important;
    }
  </style>
</head>
<body data-page="manage-tasks">
  <div class="app d-flex">
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <main class="content flex-grow-1">
      <!-- Topbar -->
      <div class="topbar py-3 px-3 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0" id="pageTitleText">Tasks Trash Bin</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
      </div>

      <div class="container-fluid p-4">
        <!-- TRASH LIST VIEW -->
        <div id="taskListView">
          <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
              <h5 class="fw-bold mb-0 text-danger"><i class="bi bi-trash3 me-2"></i>Deleted Tasks (Trash Bin)</h5>
              <a class="btn btn-outline-success rounded-pill px-4 py-2" href="manage-tasks.html">
                <i class="bi bi-arrow-left me-2"></i>Back to Tasks
              </a>
            </div>

            <!-- Filters -->
            <div class="row g-3 mb-4">
              <div class="col-md-3">
                <label for="searchTaskName" class="form-label fw-semibold text-muted">Search Task Name</label>
                <input type="text" class="form-control form-control-md rounded-3" id="searchTaskName" placeholder="Search by name...">
              </div>
              <div class="col-md-2">
                <label for="filterDate" class="form-label fw-semibold text-muted">Date</label>
                <input type="date" class="form-control form-control-md rounded-3" id="filterDate">
              </div>
              <div class="col-md-2">
                <label for="filterLocation" class="form-label fw-semibold text-muted">Location</label>
                <select class="form-select form-select-md rounded-3" id="filterLocation">
                  <option value="">All Locations</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="filterType" class="form-label fw-semibold text-muted">Task Type</label>
                <select class="form-select form-select-md rounded-3" id="filterType">
                  <option value="">All Types</option>
                  <option value="manuring">Manuring (Fertilizing)</option>
                  <option value="sanitation">Sanitation (Spraying/Slashing)</option>
                  <option value="pruning">Pruning</option>
                  <option value="harvesting">Harvesting</option>
                  <option value="planting">Planting</option>
                </select>
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <button class="btn btn-outline-danger w-100 rounded-3 py-2" id="btnClearFilters">
                  <i class="bi bi-arrow-counterclockwise me-2"></i>Clear Filters
                </button>
              </div>
            </div>

            <!-- Bulk Actions Panel -->
            <div class="row mb-3 d-none" id="bulkActionsPanel">
              <div class="col-12">
                <div class="alert alert-danger d-flex flex-wrap align-items-center justify-content-between py-2 px-3 mb-0 rounded-4 border-0 shadow-sm" style="background: rgba(220, 53, 69, 0.1);">
                  <div>
                    <span class="fw-bold text-danger me-2" id="bulkSelectedCount">0 tasks selected</span>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-sm btn-success rounded-pill px-3" id="btnBulkRestore">
                      <i class="bi bi-arrow-counterclockwise me-1"></i>Restore Selected
                    </button>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-3" id="btnBulkPermanentDelete">
                      <i class="bi bi-trash-fill me-1"></i>Delete Permanently
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tasks Table -->
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th style="width: 40px;"><input type="checkbox" class="form-check-input" id="checkAllTasks"></th>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Task Name</th>
                    <th>Type</th>
                    <th>Created By</th>
                    <th>Assigned Workers</th>
                    <th>Deleted At</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="tasksTableBody">
                  <!-- Dynamic content loaded via JS -->
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="text-muted small" id="paginationInfo">Showing 0 of 0 entries</span>
              <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0" id="paginationContainer"></ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/logout.js"></script>
  <script src="../assets/js/manage_tasks_bin.js"></script>
</body>
</html>
