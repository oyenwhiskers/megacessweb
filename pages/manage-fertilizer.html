<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Manage Fertilizers</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/roderickv1.css">

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body>
  <!-- Main Content -->
  <div class="app d-flex">
    <!-- Sidebar -->
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <!-- Main Content -->
    <main class="content flex-grow-1">

      <!-- Topbar -->
      <div class="topbar py-3 px-3 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0">Manage Fertilizers</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <!-- Content Area -->
      <div class="container my-4 px-4 mt-4">
        <!-- Header Actions -->
        <div class="px-0 mb-4">
          <h5 class="fw-semibold mb-3">List of Fertilizers :</h5>

          <!-- Search Bar + Add button -->
          <div class="d-flex flex-wrap gap-3 align-items-center">
            <!-- Search Bar -->
            <div class="flex-grow-1">
              <div class="input-group">
                <input type="text" id="fertilizerSearch" class="form-control"
                  placeholder="Search fertilizer name...">
                <button class="btn btn-secondary" id="refreshFertilizerBtn" type="button">
                  <i class="bi bi-arrow-clockwise"></i> Refresh
                </button>
              </div>
            </div>

            <!-- Add Fertilizer Button -->
            <button type="button" class="btn btn-primary d-flex align-items-center" data-bs-toggle="modal"
              data-bs-target="#addFertilizerModal">
              <i class="bi bi-plus-circle me-2"></i>
              Add Fertilizer
            </button>
          </div>
        </div>

        <!-- Table Card -->
        <div class="content-table mt-4">
          <!-- Table Header -->
          <div class="content-row content-header d-flex text-uppercase text-secondary small fw-bold border-bottom py-3 bg-light rounded-top">
            <div class="col-8 ps-3">Fertilizer Name</div>
            <div class="col-4 text-center">Action</div>
          </div>

          <!-- Loading Spinner -->
          <div id="loading" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-success" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          
          <!-- Table Body (Empty, JS will populate it) -->
          <div id="fertilizerTableBody" style="padding-bottom: 20px;"></div>

          <!-- Pagination -->
          <nav aria-label="Page navigation" class="mt-4">
            <ul id="fertilizerPagination" class="pagination justify-content-center mb-0">
              <!-- JS will render page links here -->
            </ul>
          </nav>
        </div>
      </div>

    </main>
  </div>

  <!-- Add Fertilizer Modal -->
  <div class="modal fade" id="addFertilizerModal" tabindex="-1" aria-labelledby="addFertilizerModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="addFertilizerModalLabel">Add New Fertilizer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <!-- Body -->
        <div class="modal-body">
          <form id="addFertilizerForm" onsubmit="return false;">
            <!-- Fertilizer Name -->
            <div class="mb-3">
              <label for="fertilizerName" class="form-label fw-semibold">
                Fertilizer Name
              </label>
              <input type="text" class="form-control" id="fertilizerName" placeholder="Enter fertilizer name (e.g. NPK)" required>
            </div>
          </form>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" class="btn btn-success" id="addFertilizerBtn">Add Fertilizer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Update Fertilizer Modal -->
  <div class="modal fade" id="updateFertilizerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <!-- Header -->
        <div class="modal-header bg-warning text-white">
          <h5 class="modal-title">Update Fertilizer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <!-- Body -->
        <div class="modal-body">
          <form id="updateFertilizerForm" onsubmit="return false;">
            <div class="mb-3">
              <label for="updateFertilizerName" class="form-label fw-semibold">
                Fertilizer Name
              </label>
              <input type="text" class="form-control" id="updateFertilizerName" required>
            </div>
          </form>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="updateFertilizerBtn" class="btn btn-warning">Update Fertilizer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/fertilizers.js"></script>
  <script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
    const tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el))
  </script>
  <!-- Loading overlay spinner -->
  <div id="loadingOverlay" class="loading-overlay d-none">
    <div class="spinner-border text-success" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</body>

</html>
