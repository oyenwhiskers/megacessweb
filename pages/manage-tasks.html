<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Manage Tasks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* Premium Glassmorphic / Sleek styling for Tasks */
    /* High contrast select dropdown styles */
    .form-select, .form-select option {
      color: #212529 !important;
      background-color: #fff !important;
    }
    .task-card {
      transition: all 0.25s ease-in-out;
      border: 1px solid #e1efe7 !important;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }
    .task-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(15, 107, 79, 0.08);
      border-color: #cfe4d6 !important;
    }
    .badge-status {
      padding: 0.4em 0.8em;
      border-radius: 20px;
      font-weight: 550;
      font-size: 0.85rem;
    }
    .badge-status.completed {
      background-color: #d1e7dd;
      color: #0f5132;
    }
    .badge-status.pending {
      background-color: #fff3cd;
      color: #664d03;
    }
    .badge-status.in_progress {
      background-color: #cff4fc;
      color: #055160;
    }
    .badge-status.rejected {
      background-color: #f8d7da;
      color: #842029;
    }
    .worker-entry-row {
      animation: fadeIn 0.3s ease;
      background: #f8faf9;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body data-page="manage-tasks">
  <div class="app d-flex">
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <main class="content flex-grow-1">
      <!-- Topbar -->
      <div class="topbar py-3 px-3 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0" id="pageTitleText">Manage Tasks</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
      </div>

      <div class="container-fluid p-4">
        <!-- TASK LIST VIEW -->
        <div id="taskListView">
          <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
              <h5 class="fw-bold mb-0 text-success"><i class="bi bi-list-task me-2"></i>Tasks History</h5>
              <div class="d-flex gap-2">
                <a class="btn btn-outline-danger rounded-pill px-4 py-2" href="manage-tasks-bin.html">
                  <i class="bi bi-trash me-2"></i>Trash Bin
                </a>
                <button class="btn btn-success rounded-pill px-4 py-2" id="btnShowCreateForm">
                  <i class="bi bi-plus-circle me-2"></i>Log Completed Task
                </button>
              </div>
            </div>

            <!-- Filters -->
            <div class="row g-3 mb-4">
              <div class="col-md-3">
                <label for="searchTaskName" class="form-label fw-semibold text-muted">Search Task Name</label>
                <input type="text" class="form-control form-control-md rounded-3" id="searchTaskName" placeholder="Search by name...">
              </div>
              <div class="col-md-2">
                <label for="filterDate" class="form-label fw-semibold text-muted">Date</label>
                <input type="date" class="form-control form-control-md rounded-3" id="filterDate">
              </div>
              <div class="col-md-2">
                <label for="filterLocation" class="form-label fw-semibold text-muted">Location</label>
                <select class="form-select form-select-md rounded-3" id="filterLocation">
                  <option value="">All Locations</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="filterType" class="form-label fw-semibold text-muted">Task Type</label>
                <select class="form-select form-select-md rounded-3" id="filterType">
                  <option value="">All Types</option>
                  <option value="manuring">Manuring (Fertilizing)</option>
                  <option value="sanitation">Sanitation (Spraying/Slashing)</option>
                  <option value="pruning">Pruning</option>
                  <option value="harvesting">Harvesting</option>
                  <option value="planting">Planting</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="filterStatus" class="form-label fw-semibold text-muted">Status</label>
                <select class="form-select form-select-md rounded-3" id="filterStatus">
                  <option value="">All Statuses</option>
                  <option value="in_progress">In Progress</option>
                  <option value="pending">Pending Audit</option>
                  <option value="completed">Completed</option>
                  <option value="rejected">Rejected</option>
                </select>
              </div>
              <div class="col-md-1 d-flex align-items-end">
                <button class="btn btn-outline-success w-100 rounded-3 py-2 px-1" id="btnClearFilters">
                  <i class="bi bi-arrow-counterclockwise"></i> Clear
                </button>
              </div>
            </div>

            <!-- Bulk Actions Panel -->
            <div class="row mb-3 d-none" id="bulkActionsPanel">
              <div class="col-12">
                <div class="alert alert-success d-flex flex-wrap align-items-center justify-content-between py-2 px-3 mb-0 rounded-4 border-0 shadow-sm" style="background: rgba(15, 107, 79, 0.1);">
                  <div>
                    <span class="fw-bold text-success me-2" id="bulkSelectedCount">0 tasks selected</span>
                  </div>
                  <div class="d-flex align-items-center gap-2 flex-wrap">
                    <label class="form-label mb-0 small fw-bold text-success">Bulk Status:</label>
                    <select class="form-select form-select-sm rounded-pill" id="bulkStatusSelect" style="width: 140px; cursor: pointer;">
                      <option value="" disabled selected>Update Status...</option>
                      <option value="in_progress">In Progress</option>
                      <option value="pending">Pending Audit</option>
                      <option value="completed">Completed</option>
                      <option value="rejected">Rejected</option>
                    </select>
                    <button class="btn btn-sm btn-outline-danger rounded-pill px-3" id="btnBulkDelete">
                      <i class="bi bi-trash me-1"></i>Delete
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tasks Table -->
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th style="width: 40px;"><input type="checkbox" class="form-check-input" id="checkAllTasks"></th>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Task Name</th>
                    <th>Type</th>
                    <th>Created By</th>
                    <th>Assigned Workers</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="tasksTableBody">
                  <!-- Dynamic content loaded via JS -->
                </tbody>
              </table>
            </div>

            <!-- Pagination -->
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="text-muted small" id="paginationInfo">Showing 0 of 0 entries</span>
              <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0" id="paginationContainer"></ul>
              </nav>
            </div>
          </div>
        </div>

        <!-- LOG TASK FORM VIEW (Hidden by default) -->
        <div id="logTaskFormView" style="display: none;">
          <div class="card border-0 shadow-sm rounded-4 p-4">
            <div class="d-flex align-items-center justify-content-between mb-4">
              <button class="btn btn-outline-success rounded-pill px-3" id="btnBackToTasks">
                <i class="bi bi-arrow-left me-2"></i>Back to Tasks
              </button>
              <h5 class="fw-bold mb-0 text-success">Log Completed Task (Direct Entry)</h5>
            </div>

            <form id="directTaskForm" class="needs-validation" novalidate>
              <div class="row g-3 mb-4">
                <div class="col-md-4">
                  <label for="taskDate" class="form-label fw-semibold">Task Date <span class="text-danger">*</span></label>
                  <input type="date" class="form-control form-control-md rounded-3" id="taskDate" required>
                </div>
                <div class="col-md-4">
                  <label for="taskLocation" class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
                  <select class="form-select form-select-md rounded-3" id="taskLocation" required>
                    <option value="" disabled selected>Select location...</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="taskType" class="form-label fw-semibold">Task Type <span class="text-danger">*</span></label>
                  <select class="form-select form-select-md rounded-3" id="taskType" required>
                    <option value="" disabled selected>Select type...</option>
                    <option value="manuring">Manuring (Fertilizing)</option>
                    <option value="sanitation">Sanitation (Spraying/Slashing)</option>
                    <option value="pruning">Pruning</option>
                    <option value="harvesting">Harvesting</option>
                    <option value="planting">Planting</option>
                  </select>
                </div>
                <div class="col-12">
                  <label for="taskName" class="form-label fw-semibold">Task Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control form-control-md rounded-3" id="taskName" placeholder="e.g. Harvesting Block A" required>
                </div>
              </div>

              <hr class="my-4">

              <!-- Assigned Workers Section -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h6 class="fw-bold mb-0 text-success"><i class="bi bi-people me-2"></i>Worker Quantities (Punches)</h6>
                  <div class="d-flex gap-2">
                    <input class="form-control form-control-sm rounded-3" list="workerDatalist" id="workerSelectInput" placeholder="Type worker name..." style="width: 250px;">
                    <datalist id="workerDatalist"></datalist>
                    <button class="btn btn-sm btn-success px-3 rounded-pill" type="button" id="btnAddWorkerRow">
                      <i class="bi bi-plus-lg me-1"></i>Add
                    </button>
                  </div>
                </div>

                <!-- Container of dynamic worker inputs -->
                <div id="workerRowsContainer">
                  <div class="text-center py-4 text-muted bg-light rounded-4" id="emptyWorkersPlaceholder">
                    <i class="bi bi-people-fill display-6 d-block mb-2 text-secondary"></i>
                    No workers added yet. Select a worker above and click "Add".
                  </div>
                </div>
              </div>

              <div class="d-flex justify-content-end gap-3 mt-4">
                <button class="btn btn-outline-secondary rounded-pill px-4" type="button" id="btnCancelForm">Cancel</button>
                <button class="btn btn-success rounded-pill px-4" type="submit" id="btnSubmitTask">
                  <i class="bi bi-check-circle me-2"></i>Submit & Complete Task
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/logout.js"></script>
  <script src="../assets/js/manage_tasks.js"></script>
</body>
</html>
