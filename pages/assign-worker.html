<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MegaCess Web • Assign Worker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body data-page="assign-worker">
  <div class="app d-flex">
    <aside class="sidebar p-3" id="sidebar-root"></aside>

    <main class="content flex-grow-1">
      <div class="topbar py-3 px-3 d-flex align-items-center justify-content-between">
        <h1 class="page-title h5 mb-0">Assign Worker</h1>
        <button class="btn btn-outline-light d-lg-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
      </div>
      <div class="container-fluid p-4">
        <!-- Mandor List View -->
        <div id="mandorListView">
          <!-- Search Bar -->
          <div class="mb-4">
            <label for="searchInput" class="form-label fw-semibold">Search for Mandor:</label>
            <input type="text" class="form-control form-control-md" placeholder="Search name..." id="searchInput">
          </div>
          <hr>

          <!-- List of Mandor -->
          <div>
            <h6 class="mb-3">List of Mandor:</h6>
            <!-- Mandor List Container -->
            <div id="mandorList">
              <!-- Mandor items will be loaded here dynamically -->
            </div>
          </div>
        </div>

        <!-- Worker Detail View (Hidden by default) -->
        <div id="workerDetailView" style="display: none;">
          <!-- Back Button and Title -->
          <div class="d-flex align-items-center justify-content-between mb-4">
            <button class="btn btn-success d-flex align-items-center gap-2" id="backToMandorList">
              <i class="bi bi-arrow-left"></i> Back to List 
            </button>
            <button class="btn btn-success d-flex align-items-center gap-2" id="assignWorkerBtn">
              <i class="bi bi-plus-circle"></i>
              Assign Worker
            </button>
          </div>
          <hr>

          <!-- List of Workers Under Mandor -->
          <div>
            <h6 class="mb-3">List of worker under <span id="selectedMandorName" class="fw-bold"></span>:</h6>
            
            <!-- Worker Search Bar -->
            <div class="mb-3">
              <input type="text" class="form-control" placeholder="Search worker name..." id="workerSearchInput">
            </div>
            
            <!-- Worker List Container -->
            <div id="workerList">
              <!-- Worker items will be loaded here dynamically -->
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Select Worker Modal -->
  <div class="modal fade" id="selectWorkerModal" tabindex="-1" aria-labelledby="selectWorkerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title" id="selectWorkerModalLabel">Select Worker</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Search Bar -->
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Search for worker..." id="unassignedWorkerSearchInput">
          </div>
          <hr>
          
          <!-- Unassigned Workers List -->
          <div id="unassignedWorkersList" style="max-height: 400px; overflow-y: auto;">
            <!-- Unassigned workers will be loaded here -->
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-success" id="saveAssignmentBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/logout.js"></script>
  <script src="../assets/js/assign_worker.js"></script>
</body>
</html>
